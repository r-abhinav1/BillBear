{% extends 'base.html' %}
{% import '_ui.html' as ui %}
{% block title %}Join a room, BillBear{% endblock %}
{% block topbar_left %}<a class="backlink" href="/">{{ ui.icon('back', 18) }} Home</a>{% endblock %}
{% block content %}
<main class="stack stack--lg">
    <h1>Join a room</h1>
    {% if error %}<div class="notice notice--error" role="alert">{{ error }}</div>{% endif %}
    <div>
        <div class="bear-peek" style="width: 132px; height: 84px; margin-left: 24px">{{ ui.bear(132) }}</div>
        <section class="receipt">
            <form method="POST" class="paper stack">
                <div class="field">
                    <label for="room_code">Room code</label>
                    <input class="input input--code" type="text" id="room_code" name="room_code" required
                           autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABC123"
                           value="{{ request.args.get('room_code', '') or request.form.get('room_code', '') }}"
                           maxlength="6" pattern="[A-Za-z0-9]{3,10}"
                           title="Six letters and numbers, from your host">
                </div>
                <div class="field">
                    <label for="user_name">Your name</label>
                    <input class="input" type="text" id="user_name" name="user_name" required maxlength="30"
                           placeholder="What your friends call you"
                           value="{{ request.form.get('user_name', '') }}" autocomplete="given-name">
                </div>
                <button type="submit" class="btn btn--primary btn--block">Join room</button>
            </form>
            <div class="tear"></div>
        </section>
    </div>
</main>
{% endblock %}
